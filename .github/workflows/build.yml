name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONOPTIMIZE: "1"

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target_arch: x64
            artifact_name: SileroTTS_Studio_Windows.zip
            
          - name: Linux-x86_64
            os: ubuntu-latest
            target_arch: x86_64
            artifact_name: SileroTTS_Studio_Linux_x86_64.zip
            
          - name: Linux-ARM64
            os: ubuntu-24.04-arm
            target_arch: arm64
            artifact_name: SileroTTS_Studio_Linux_arm64.zip

          - name: macOS-AppleSilicon-ARM64
            os: macos-latest
            target_arch: arm64
            artifact_name: SileroTTS_Studio_macOS_AppleSilicon_ARM64.zip

          - name: macOS-Intel-x86_64
            os: macos-latest
            target_arch: x86_64
            artifact_name: SileroTTS_Studio_macOS_Intel_x86_64.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies in venv
        run: |
          python -m pip install --upgrade pip
          python -m venv .venv
          
          if [ "${{ runner.os }}" = "Windows" ]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          
          pip install --upgrade setuptools wheel
          pip install pyinstaller
          pip install -r requirements.txt
        shell: bash

      - name: Setup FFmpeg
        uses: AnimMouse/setup-ffmpeg@v1

      - name: Prepare FFmpeg Binaries (Windows)
        if: runner.os == 'Windows'
        run: |
          $ffmpegPath = (Get-Command ffmpeg.exe).Source
          $ffprobePath = (Get-Command ffprobe.exe).Source
          copy $ffmpegPath .\ffmpeg.exe
          copy $ffprobePath .\ffprobe.exe

      - name: Prepare FFmpeg Binaries (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          cp $(which ffmpeg) ./ffmpeg
          cp $(which ffprobe) ./ffprobe
          chmod +x ffmpeg ffprobe

      # Сборка Windows
      - name: Build Windows
        if: runner.os == 'Windows'
        run: |
          # 1. Полная версия (Папка с запеченным FFmpeg)
          .\.venv\Scripts\pyinstaller --noconfirm --noconsole --onedir --add-binary "ffmpeg.exe;." --add-binary "ffprobe.exe;." --name "SileroTTS_Studio_Windows" SileroTTS_Studio.py
          
          # 2. Portable версия (Легковесный .exe ~27 МБ)
          .\.venv\Scripts\pyinstaller --noconfirm --noconsole --onefile --name "SileroTTS_Studio_Windows_Portable" SileroTTS_Studio.py

      # Сборка Linux
      - name: Build Linux
        if: runner.os == 'Linux'
        run: |
          # 1. Полная версия (Папка с запеченным FFmpeg)
          ./.venv/bin/pyinstaller --noconfirm --noconsole --onedir --add-binary "ffmpeg:." --add-binary "ffprobe:." --name "SileroTTS_Studio_Linux_${{ matrix.target_arch }}" SileroTTS_Studio.py
          
          # 2. Portable версия (Один файл)
          ./.venv/bin/pyinstaller --noconfirm --noconsole --onefile --name "SileroTTS_Studio_Linux_${{ matrix.target_arch }}_Portable" SileroTTS_Studio.py

      # Сборка macOS
      - name: Build macOS
        if: runner.os == 'macOS'
        run: |
          # 1. Полная версия (.app с запеченным FFmpeg)
          ./.venv/bin/pyinstaller --noconfirm --windowed --onedir \
            --add-binary "ffmpeg:." \
            --add-binary "ffprobe:." \
            --target-architecture=${{ matrix.target_arch }} \
            --name "SileroTTS_Studio_macOS_${{ matrix.target_arch }}" \
            SileroTTS_Studio.py
          
          APP_FULL="dist/SileroTTS_Studio_macOS_${{ matrix.target_arch }}.app"
          chmod +x "$APP_FULL/Contents/Resources/ffmpeg" "$APP_FULL/Contents/Resources/ffprobe"
          plutil -replace NSHighResolutionCapable -bool true "$APP_FULL/Contents/Info.plist" || plutil -insert NSHighResolutionCapable -bool true "$APP_FULL/Contents/Info.plist"
          codesign --force --sign - "$APP_FULL"

          # 2. Portable версия (Создает .app пакет)
          ./.venv/bin/pyinstaller --noconfirm --windowed --onefile \
            --target-architecture=${{ matrix.target_arch }} \
            --name "SileroTTS_Studio_macOS_${{ matrix.target_arch }}_Portable" \
            SileroTTS_Studio.py
            
          APP_PORTABLE="dist/SileroTTS_Studio_macOS_${{ matrix.target_arch }}_Portable.app"
          if [ -d "$APP_PORTABLE" ]; then
            plutil -replace NSHighResolutionCapable -bool true "$APP_PORTABLE/Contents/Info.plist" || plutil -insert NSHighResolutionCapable -bool true "$APP_PORTABLE/Contents/Info.plist"
            codesign --force --sign - "$APP_PORTABLE"
          fi

      # Упаковка артефактов
      - name: Package Artifacts
        run: |
          cd dist
          export COPYFILE_DISABLE=1
          
          # --- Windows ---
          if [ "${{ runner.os }}" = "Windows" ] && [ -d "SileroTTS_Studio_Windows" ]; then
            tar -a -c -f SileroTTS_Studio_Windows.zip SileroTTS_Studio_Windows
          fi
          
          # --- Linux ---
          if [ "${{ runner.os }}" = "Linux" ]; then
            if [ -d "SileroTTS_Studio_Linux_${{ matrix.target_arch }}" ]; then
              tar -a -c -f "SileroTTS_Studio_Linux_${{ matrix.target_arch }}.zip" "SileroTTS_Studio_Linux_${{ matrix.target_arch }}"
            fi
            if [ -f "SileroTTS_Studio_Linux_${{ matrix.target_arch }}_Portable" ]; then
              tar -a -c -f "SileroTTS_Studio_Linux_${{ matrix.target_arch }}_Portable.zip" "SileroTTS_Studio_Linux_${{ matrix.target_arch }}_Portable"
            fi
          fi
          
          # --- macOS ---
          if [ "${{ runner.os }}" = "macOS" ]; then
            # 1. Полная версия (.app)
            if [ -d "SileroTTS_Studio_macOS_${{ matrix.target_arch }}.app" ]; then
              ditto -c -k --keepParent "SileroTTS_Studio_macOS_${{ matrix.target_arch }}.app" "SileroTTS_Studio_macOS_${{ matrix.target_arch }}.zip"
            fi
            
            # 2. Portable версия (.app)
            if [ -d "SileroTTS_Studio_macOS_${{ matrix.target_arch }}_Portable.app" ]; then
              ditto -c -k --keepParent "SileroTTS_Studio_macOS_${{ matrix.target_arch }}_Portable.app" "SileroTTS_Studio_macOS_${{ matrix.target_arch }}_Portable.zip"
            fi
          fi

        shell: bash

      # Релиз архивов и прямого .exe файла
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.exe
