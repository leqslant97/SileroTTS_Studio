name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Use a maintained CPython line with the current bundled Tcl/Tk fixes.
  # setup-python resolves this to the newest available 3.13 patch release.
  PYTHON_VERSION: "3.13"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            app_name: SileroTTS_Studio_Windows
            artifact_name: SileroTTS_Studio_Windows.exe
            pyinstaller: .venv/Scripts/pyinstaller.exe
          - name: Linux x86_64
            os: ubuntu-latest
            app_name: SileroTTS_Studio_Linux_x86_64
            artifact_name: SileroTTS_Studio_Linux_x86_64.zip
            pyinstaller: .venv/bin/pyinstaller
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            app_name: SileroTTS_Studio_Linux_arm64
            artifact_name: SileroTTS_Studio_Linux_arm64.zip
            pyinstaller: .venv/bin/pyinstaller
          - name: macOS Apple Silicon ARM64
            os: macos-15
            app_name: SileroTTS_Studio_macOS_arm64
            artifact_name: SileroTTS_Studio_macOS_AppleSilicon_ARM64.zip
            pyinstaller: .venv/bin/pyinstaller
            target_arch: arm64
          - name: macOS Intel x86_64
            os: macos-15-intel
            app_name: SileroTTS_Studio_macOS_x86_64
            artifact_name: SileroTTS_Studio_macOS_Intel_x86_64.zip
            pyinstaller: .venv/bin/pyinstaller
            target_arch: x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Show Python and Tk versions
        shell: bash
        run: |
          python - <<'PY'
          import platform
          import sys
          import tkinter

          tcl = tkinter.Tcl()
          print("Python:", sys.version)
          print("Architecture:", platform.machine())
          print("Tcl/Tk:", tcl.call("info", "patchlevel"))
          PY

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk zip

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m venv .venv
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pyinstaller
          python -m pip install -r requirements.txt

      - name: Set up FFmpeg
        uses: AnimMouse/setup-ffmpeg@v1

      - name: Copy FFmpeg tools on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item (Get-Command ffmpeg).Source ffmpeg.exe
          Copy-Item (Get-Command ffprobe).Source ffprobe.exe

      - name: Copy FFmpeg tools on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cp "$(command -v ffmpeg)" ffmpeg
          cp "$(command -v ffprobe)" ffprobe
          chmod +x ffmpeg ffprobe

      - name: Build Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${{ matrix.pyinstaller }}" `
            --noconfirm `
            --clean `
            --noconsole `
            --onefile `
            --add-binary "ffmpeg.exe;." `
            --add-binary "ffprobe.exe;." `
            --name "${{ matrix.app_name }}" `
            SileroTTS_Studio.py

      - name: Build Linux app
        if: runner.os == 'Linux'
        shell: bash
        run: |
          "${{ matrix.pyinstaller }}" \
            --noconfirm \
            --clean \
            --onedir \
            --add-binary "ffmpeg:." \
            --add-binary "ffprobe:." \
            --name "${{ matrix.app_name }}" \
            SileroTTS_Studio.py

      - name: Build macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          "${{ matrix.pyinstaller }}" \
            --noconfirm \
            --clean \
            --windowed \
            --onedir \
            --add-binary "ffmpeg:." \
            --add-binary "ffprobe:." \
            --target-architecture "${{ matrix.target_arch }}" \
            --osx-bundle-identifier "ru.silero.tts-studio" \
            --name "${{ matrix.app_name }}" \
            SileroTTS_Studio.py

          app_path="dist/${{ matrix.app_name }}.app"
          find "$app_path" -type f \( -name ffmpeg -o -name ffprobe \) -exec chmod +x {} \;
          plutil -replace NSHighResolutionCapable -bool true "$app_path/Contents/Info.plist" || \
            plutil -insert NSHighResolutionCapable -bool true "$app_path/Contents/Info.plist"
          codesign --force --deep --sign - "$app_path"

      - name: Package Linux app
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd dist
          zip -r "${{ matrix.artifact_name }}" "${{ matrix.app_name }}"

      - name: Package macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd dist
          export COPYFILE_DISABLE=1
          ditto -c -k --keepParent "${{ matrix.app_name }}.app" "${{ matrix.artifact_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}
          if-no-files-found: error

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact_name }}
