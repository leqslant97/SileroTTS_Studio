name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONOPTIMIZE: "1"


jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target_arch: x64
            artifact_name: SileroTTS_Studio_Windows.zip
            
          - name: Linux-x86_64
            os: ubuntu-latest
            target_arch: x86_64
            artifact_name: SileroTTS_Studio_Linux_x86_64.zip
            
          - name: Linux-ARM64
            os: ubuntu-24.04-arm
            target_arch: arm64
            artifact_name: SileroTTS_Studio_Linux_arm64.zip

          - name: macOS-AppleSilicon-ARM64
            os: macos-latest
            target_arch: arm64
            artifact_name: SileroTTS_Studio_macOS_AppleSilicon_ARM64.zip

          - name: macOS-Intel-x86_64
            os: macos-latest
            target_arch: x86_64
            artifact_name: SileroTTS_Studio_macOS_Intel_x86_64.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install --upgrade setuptools wheel
          pip install -r requirements.txt

      # НАДЕЖНЫЙ ШАГ: Используем официальный экшен с полной поддержкой ARM64 и x64 на всех ОС
      - name: Setup FFmpeg
        uses: AnimMouse/setup-ffmpeg@v1

      # Находим, куда экшен сохранил бинарники, и копируем их в корень проекта
      - name: Prepare FFmpeg Binaries (Windows)
        if: runner.os == 'Windows'
        run: |
          $ffmpegPath = (Get-Command ffmpeg.exe).Source
          $ffprobePath = (Get-Command ffprobe.exe).Source
          copy $ffmpegPath .\ffmpeg.exe
          copy $ffprobePath .\ffprobe.exe

      - name: Prepare FFmpeg Binaries (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          cp $(which ffmpeg) ./ffmpeg
          cp $(which ffprobe) ./ffprobe
          chmod +x ffmpeg ffprobe

      # Сборка для Windows
      - name: Build Windows (Folder)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconsole --onedir \
            --add-binary "ffmpeg.exe;." \
            --add-binary "ffprobe.exe;." \
            --exclude-module numpy \
            --exclude-module matplotlib \
            --name "SileroTTS_Studio_Windows" \
            SileroTTS_Studio.py
      
      # Сборка для Linux (ИСПРАВЛЕНО: убрали вызов через python -m, вызываем pyinstaller напрямую)
      - name: Build Linux (Folder)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconsole --onedir \
            --add-binary "ffmpeg:." \
            --add-binary "ffprobe:." \
            --exclude-module numpy \
            --exclude-module matplotlib \
            --name "SileroTTS_Studio_Linux_${{ matrix.target_arch }}" \
            SileroTTS_Studio.py
      
      # Сборка для macOS
      - name: Build macOS (.app)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --windowed --onedir \
            --add-binary "ffmpeg:." \
            --add-binary "ffprobe:." \
            --target-architecture=${{ matrix.target_arch }} \
            --name "SileroTTS_Studio_macOS_${{ matrix.target_arch }}" \
            SileroTTS_Studio.py
          
          APP_PATH="dist/SileroTTS_Studio_macOS_${{ matrix.target_arch }}.app"
          plutil -replace NSHighResolutionCapable -bool true "$APP_PATH/Contents/Info.plist" || plutil -insert NSHighResolutionCapable -bool true "$APP_PATH/Contents/Info.plist"
          codesign --force --sign - "$APP_PATH"


      - name: Package Artifacts into ZIP
        run: |
          cd dist
          # Упаковываем Windows через универсальный tar
          if [ -d "SileroTTS_Studio_Windows" ]; then
            tar -a -c -f SileroTTS_Studio_Windows.zip SileroTTS_Studio_Windows
          fi
          # Упаковываем Linux
          if [ -d "SileroTTS_Studio_Linux_${{ matrix.target_arch }}" ]; then
            tar -a -c -f "SileroTTS_Studio_Linux_${{ matrix.target_arch }}.zip" "SileroTTS_Studio_Linux_${{ matrix.target_arch }}"
          fi
          # Упаковываем macOS
          if [ -d "SileroTTS_Studio_macOS_${{ matrix.target_arch }}.app" ]; then
            tar -a -c -f "SileroTTS_Studio_macOS_${{ matrix.target_arch }}.zip" "SileroTTS_Studio_macOS_${{ matrix.target_arch }}.app"
          fi
        shell: bash

    
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
