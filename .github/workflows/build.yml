name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Keep release artifacts reproducible instead of silently switching patch
  # versions when runner tool caches are refreshed.
  PYTHON_VERSION: "3.13.15"
  # macOS uses Homebrew Python/Tk because setup-python's macOS distribution
  # currently embeds Tk 8.6. The Aqua build needs Tk 9 for reliable live
  # switching between the system light and dark appearances.
  MACOS_TK_SERIES: "9.0"
  # Branch/workflow_dispatch builds have no release tag to derive a version from.
  APP_VERSION_FALLBACK: "1.4.1"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            app_name: SileroTTS_Studio_Windows
            portable_name: SileroTTS_Studio_Windows_Portable
            artifact_name: SileroTTS_Studio_Windows.zip
            portable_artifact_name: SileroTTS_Studio_Windows_Portable.exe
            pyinstaller: .venv/Scripts/pyinstaller.exe
          - name: Linux x86_64
            os: ubuntu-latest
            app_name: SileroTTS_Studio_Linux_x86_64
            portable_name: SileroTTS_Studio_Linux_x86_64_Portable
            artifact_name: SileroTTS_Studio_Linux_x86_64.zip
            portable_artifact_name: SileroTTS_Studio_Linux_x86_64_Portable.zip
            pyinstaller: .venv/bin/pyinstaller
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            app_name: SileroTTS_Studio_Linux_arm64
            portable_name: SileroTTS_Studio_Linux_arm64_Portable
            artifact_name: SileroTTS_Studio_Linux_arm64.zip
            portable_artifact_name: SileroTTS_Studio_Linux_arm64_Portable.zip
            pyinstaller: .venv/bin/pyinstaller
          - name: macOS Apple Silicon ARM64
            os: macos-15
            app_name: SileroTTS_Studio_macOS_arm64
            artifact_name: SileroTTS_Studio_macOS_AppleSilicon_ARM64.zip
            pyinstaller: .venv/bin/pyinstaller
            target_arch: arm64
          - name: macOS Intel x86_64
            os: macos-15-intel
            app_name: SileroTTS_Studio_macOS_x86_64
            artifact_name: SileroTTS_Studio_macOS_Intel_x86_64.zip
            pyinstaller: .venv/bin/pyinstaller
            target_arch: x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve application version
        shell: bash
        run: |
          version="$APP_VERSION_FALLBACK"

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            version="${version%%-*}"
            version="${version%%+*}"
          fi

          if [[ "$version" =~ ^[0-9]+\.[0-9]+$ ]]; then
            version="${version}.0"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Некорректная версия приложения: $version"
            exit 1
          fi

          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "Application version: $version"

      - name: Set up Python on Windows and Linux
        if: runner.os != 'macOS'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Homebrew Python and Tk on macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          # setup-python's macOS build currently carries Tk 8.6. Use the
          # Homebrew split tkinter formula so PyInstaller collects Tcl/Tk 9.
          # Do not update Homebrew in this job: moving formulae can silently
          # change the pinned Python patch between otherwise identical reruns.
          brew install "python@${PYTHON_VERSION%.*}" "python-tk@${PYTHON_VERSION%.*}"
          python_series="${PYTHON_VERSION%.*}"
          python_prefix="$(brew --prefix "python@$python_series")"
          python_bin="$python_prefix/bin/python$python_series"
          test -x "$python_bin"
          echo "MACOS_PYTHON=$python_bin" >> "$GITHUB_ENV"
          echo "Homebrew Python: $python_bin"
          "$python_bin" --version
          installed_python_version="$($python_bin -c 'import platform; print(platform.python_version())')"
          test "$installed_python_version" = "$PYTHON_VERSION"
          brew list --versions "python@${PYTHON_VERSION%.*}" \
            "python-tk@${PYTHON_VERSION%.*}" tcl-tk

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk zip

      - name: Verify Python and Tk build environment
        shell: bash
        env:
          EXPECTED_MACOS_ARCH: ${{ matrix.target_arch }}
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            py="$MACOS_PYTHON"
          else
            py=python
          fi
          "$py" - <<'PY'
          import os
          import platform
          import sys
          import tkinter

          tcl = tkinter.Tcl()
          expected_python = tuple(map(int, os.environ["PYTHON_VERSION"].split(".")))
          actual_python = sys.version_info[:3]
          if actual_python != expected_python:
              raise SystemExit(
                  f"Python {actual_python!r} does not match required {expected_python!r}"
              )

          tk_patchlevel = str(tcl.call("info", "patchlevel"))
          print("Python:", sys.version)
          print("Architecture:", platform.machine())
          print("Tcl/Tk:", tk_patchlevel)
          print("_tkinter:", tkinter._tkinter.__file__)

          if sys.platform == "darwin":
              expected_arch = os.environ["EXPECTED_MACOS_ARCH"]
              if platform.machine() != expected_arch:
                  raise SystemExit(
                      f"macOS Python architecture {platform.machine()!r}; "
                      f"expected {expected_arch!r}"
                  )
              expected_tk = os.environ["MACOS_TK_SERIES"]
              if tkinter.TclVersion != 9.0 or tkinter.TkVersion != 9.0:
                  raise SystemExit(
                      f"macOS release requires Tcl/Tk {expected_tk}.x; "
                      f"got Tcl {tkinter.TclVersion}, Tk {tkinter.TkVersion}"
                  )
              if not tk_patchlevel.startswith(expected_tk + "."):
                  raise SystemExit(
                      f"macOS release requires Tcl/Tk {expected_tk}.x; "
                      f"got {tk_patchlevel}"
                  )
          PY

      - name: Install Python dependencies
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            py="$MACOS_PYTHON"
          else
            py=python
          fi
          "$py" -m venv .venv
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          # Install only the checked-in lock so release binaries do not depend
          # on whichever transitive versions happen to be newest on build day.
          python -m pip install -r requirements-release.txt
          python -m pip check

      - name: Verify Python runtime dependencies
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            py=.venv/Scripts/python.exe
          else
            py=.venv/bin/python
          fi
          "$py" - <<'PY'
          import audioop
          import os
          import ebooklib
          import docx
          import lxml
          import pydub
          import pydub.utils
          import requests
          import ru_normalizr
          import sys
          import tkinter
          from bs4 import BeautifulSoup
          from ebooklib import epub
          from pathlib import Path
          from tempfile import TemporaryDirectory

          assert pydub.utils.audioop is audioop
          if sys.version_info >= (3, 13):
              assert getattr(audioop, "__file__", None), "Python 3.13 must load audioop-lts"
          if sys.platform == "darwin":
              expected_python = tuple(
                  map(int, os.environ["PYTHON_VERSION"].split("."))
              )
              assert sys.version_info[:3] == expected_python
              assert tkinter.TclVersion == 9.0
              assert tkinter.TkVersion == 9.0
              assert str(tkinter.Tcl().call("info", "patchlevel")).startswith(
                  os.environ["MACOS_TK_SERIES"] + "."
              )

          book = epub.EpubBook()
          book.set_identifier("ci-smoke")
          book.set_title("CI smoke test")
          book.set_language("ru")
          book.add_author("Автор")
          chapter = epub.EpubHtml(title="Глава", file_name="chapter.xhtml", lang="ru")
          chapter.content = "<h1>Глава</h1><p>Привет</p>"
          book.add_item(chapter)
          book.toc = (epub.Link("chapter.xhtml", "Глава", "chapter"),)
          book.spine = ["nav", chapter]
          book.add_item(epub.EpubNcx())
          book.add_item(epub.EpubNav())
          with TemporaryDirectory() as directory:
              path = Path(directory) / "smoke.epub"
              epub.write_epub(str(path), book)
              loaded = epub.read_epub(str(path))
              assert list(loaded.get_items_of_type(ebooklib.ITEM_DOCUMENT))

          print("audioop:", getattr(audioop, "__file__", "built-in"))
          print("pydub:", pydub.__file__)
          print("EbookLib EPUB smoke test: OK")
          PY

      - name: Set up FFmpeg
        uses: AnimMouse/setup-ffmpeg@v1

      - name: Verify required FFmpeg codecs
        shell: bash
        run: |
          encoders="$(ffmpeg -hide_banner -encoders 2>&1)"
          decoders="$(ffmpeg -hide_banner -decoders 2>&1)"
          grep -q 'libopus' <<< "$encoders"
          grep -q 'libvorbis' <<< "$encoders"
          grep -Eq '[[:space:]]opus([[:space:]]|$)' <<< "$decoders"
          grep -Eq '[[:space:]]vorbis([[:space:]]|$)' <<< "$decoders"

      - name: Run regression tests
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            py=.venv/Scripts/python.exe
          else
            py=.venv/bin/python
          fi
          "$py" -m unittest discover -s tests -v

      - name: Copy FFmpeg tools on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item (Get-Command ffmpeg).Source ffmpeg.exe
          Copy-Item (Get-Command ffprobe).Source ffprobe.exe

      - name: Copy FFmpeg tools on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cp "$(command -v ffmpeg)" ffmpeg
          cp "$(command -v ffprobe)" ffprobe
          chmod +x ffmpeg ffprobe

      - name: Create Windows version resources
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parts = $env:APP_VERSION.Split('.')
          if ($parts.Count -ne 3) {
            throw "APP_VERSION must contain three numeric components: $env:APP_VERSION"
          }
          $versionTuple = "$($parts[0]), $($parts[1]), $($parts[2]), 0"

          function New-PyInstallerVersionFile {
            param(
              [Parameter(Mandatory = $true)][string] $Path,
              [Parameter(Mandatory = $true)][string] $InternalName,
              [Parameter(Mandatory = $true)][string] $OriginalFilename
            )

            $content = @"
          # UTF-8
          VSVersionInfo(
            ffi=FixedFileInfo(
              filevers=($versionTuple),
              prodvers=($versionTuple),
              mask=0x3f,
              flags=0x0,
              OS=0x40004,
              fileType=0x1,
              subtype=0x0,
              date=(0, 0)
            ),
            kids=[
              StringFileInfo([
                StringTable(
                  '040904B0',
                  [
                    StringStruct('FileDescription', 'Silero TTS Studio'),
                    StringStruct('FileVersion', '$env:APP_VERSION'),
                    StringStruct('InternalName', '$InternalName'),
                    StringStruct('OriginalFilename', '$OriginalFilename'),
                    StringStruct('ProductName', 'Silero TTS Studio'),
                    StringStruct('ProductVersion', '$env:APP_VERSION')
                  ]
                )
              ]),
              VarFileInfo([VarStruct('Translation', [1033, 1200])])
            ]
          )
          "@
            Set-Content -LiteralPath $Path -Value $content -Encoding utf8
          }

          New-PyInstallerVersionFile `
            -Path "windows-full-version.txt" `
            -InternalName "${{ matrix.app_name }}" `
            -OriginalFilename "${{ matrix.app_name }}.exe"
          New-PyInstallerVersionFile `
            -Path "windows-portable-version.txt" `
            -InternalName "${{ matrix.portable_name }}" `
            -OriginalFilename "${{ matrix.portable_name }}.exe"

      - name: Build Windows apps
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Full onedir build with bundled FFmpeg/FFprobe.
          & "${{ matrix.pyinstaller }}" `
            --noconfirm `
            --clean `
            --noconsole `
            --onedir `
            --hidden-import audioop `
            --add-binary "ffmpeg.exe;." `
            --add-binary "ffprobe.exe;." `
            --version-file "windows-full-version.txt" `
            --name "${{ matrix.app_name }}" `
            SileroTTS_Studio.py

          # Portable onefile build intentionally uses system FFmpeg/FFprobe.
          & "${{ matrix.pyinstaller }}" `
            --noconfirm `
            --clean `
            --noconsole `
            --onefile `
            --hidden-import audioop `
            --version-file "windows-portable-version.txt" `
            --name "${{ matrix.portable_name }}" `
            SileroTTS_Studio.py

      - name: Verify Windows executable versions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $expected = [version] "$($env:APP_VERSION).0"
          $binaries = @(
            "dist/${{ matrix.app_name }}/${{ matrix.app_name }}.exe",
            "dist/${{ matrix.portable_name }}.exe"
          )

          foreach ($binary in $binaries) {
            $info = (Get-Item -LiteralPath $binary).VersionInfo
            $actual = [version] "$($info.FileMajorPart).$($info.FileMinorPart).$($info.FileBuildPart).$($info.FilePrivatePart)"
            if ($actual -ne $expected) {
              throw "$binary has file version $actual; expected $expected"
            }
            if ($info.ProductVersion -ne $env:APP_VERSION) {
              throw "$binary has product version '$($info.ProductVersion)'; expected '$env:APP_VERSION'"
            }
            if ($info.ProductName -ne "Silero TTS Studio") {
              throw "$binary has unexpected product name '$($info.ProductName)'"
            }
          }

      - name: Build Linux apps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Full onedir build with bundled FFmpeg/FFprobe.
          "${{ matrix.pyinstaller }}" \
            --noconfirm \
            --clean \
            --noconsole \
            --onedir \
            --hidden-import audioop \
            --add-binary "ffmpeg:." \
            --add-binary "ffprobe:." \
            --name "${{ matrix.app_name }}" \
            SileroTTS_Studio.py

          # Portable onefile build intentionally uses system FFmpeg/FFprobe.
          "${{ matrix.pyinstaller }}" \
            --noconfirm \
            --clean \
            --noconsole \
            --onefile \
            --hidden-import audioop \
            --name "${{ matrix.portable_name }}" \
            SileroTTS_Studio.py

      - name: Build macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # macOS ships only the full onedir .app with bundled FFmpeg/FFprobe.
          "${{ matrix.pyinstaller }}" \
            --noconfirm \
            --clean \
            --windowed \
            --onedir \
            --hidden-import audioop \
            --add-binary "ffmpeg:." \
            --add-binary "ffprobe:." \
            --target-architecture "${{ matrix.target_arch }}" \
            --osx-bundle-identifier "ru.silero.tts-studio" \
            --name "${{ matrix.app_name }}" \
            SileroTTS_Studio.py

          app_path="dist/${{ matrix.app_name }}.app"
          find "$app_path" -type f \( -name ffmpeg -o -name ffprobe \) -exec chmod +x {} \;
          plist="$app_path/Contents/Info.plist"
          plutil -replace NSHighResolutionCapable -bool true "$plist" || \
            plutil -insert NSHighResolutionCapable -bool true "$plist"
          plutil -replace CFBundleShortVersionString -string "$APP_VERSION" "$plist" || \
            plutil -insert CFBundleShortVersionString -string "$APP_VERSION" "$plist"
          plutil -replace CFBundleVersion -string "$APP_VERSION" "$plist" || \
            plutil -insert CFBundleVersion -string "$APP_VERSION" "$plist"
          plutil -lint "$plist"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$plist")" = "$APP_VERSION"
          test "$(plutil -extract CFBundleVersion raw -o - "$plist")" = "$APP_VERSION"
          codesign --force --deep --sign - "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"

      - name: Package Windows full app
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd dist
          7z a -tzip "${{ matrix.artifact_name }}" "${{ matrix.app_name }}"

      - name: Package Linux apps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd dist
          zip -r "${{ matrix.artifact_name }}" "${{ matrix.app_name }}"
          zip "${{ matrix.portable_artifact_name }}" "${{ matrix.portable_name }}"

      - name: Package macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd dist
          export COPYFILE_DISABLE=1
          ditto -c -k --keepParent "${{ matrix.app_name }}.app" "${{ matrix.artifact_name }}"

      - name: Verify packaged artifacts
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            test -f "dist/${{ matrix.artifact_name }}"
            test -f "dist/${{ matrix.portable_artifact_name }}"
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            test -f "dist/${{ matrix.artifact_name }}"
            test -f "dist/${{ matrix.portable_artifact_name }}"
          else
            test -f "dist/${{ matrix.artifact_name }}"
            test ! -e "dist/${{ matrix.app_name }}_Portable.app"
          fi

      - name: Verify portable onefile builds
        if: runner.os == 'Windows' || runner.os == 'Linux'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            portable="dist/${{ matrix.portable_name }}.exe"
          else
            portable="dist/${{ matrix.portable_name }}"
          fi
          test -f "$portable"
          test ! -d "$portable"

      - name: Verify macOS bundle contents and architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app_path="dist/${{ matrix.app_name }}.app"
          executable="$app_path/Contents/MacOS/${{ matrix.app_name }}"
          file "$executable"
          lipo "$executable" -verify_arch "${{ matrix.target_arch }}"
          ffmpeg_path="$(find "$app_path/Contents" -type f -name ffmpeg -perm -111 -print -quit)"
          ffprobe_path="$(find "$app_path/Contents" -type f -name ffprobe -perm -111 -print -quit)"
          test -n "$ffmpeg_path"
          test -n "$ffprobe_path"
          for media_binary in "$ffmpeg_path" "$ffprobe_path"; do
            file "$media_binary"
            lipo "$media_binary" -verify_arch "${{ matrix.target_arch }}"
            media_links="$(otool -L "$media_binary")"
            printf '%s\n' "$media_links"
            if grep -Eq '/(opt/homebrew|usr/local)/(Cellar|opt)/' \
              <<< "$media_links"; then
              echo "::error::$media_binary still depends on Homebrew paths"
              exit 1
            fi
          done
          encoders="$("$ffmpeg_path" -hide_banner -encoders 2>&1)"
          decoders="$("$ffmpeg_path" -hide_banner -decoders 2>&1)"
          grep -q 'libopus' <<< "$encoders"
          grep -q 'libvorbis' <<< "$encoders"
          grep -Eq '[[:space:]]opus([[:space:]]|$)' <<< "$decoders"
          grep -Eq '[[:space:]]vorbis([[:space:]]|$)' <<< "$decoders"

          # Validate what PyInstaller actually embedded, not only the Python
          # selected before the build. This prevents a green job with the
          # setup-python Tcl/Tk 8.6 frameworks accidentally collected again.
          python_plist="$(find "$app_path/Contents/Frameworks/Python.framework" \
            -path '*/Resources/Info.plist' -print -quit)"
          test -n "$python_plist"
          test "$(plutil -extract CFBundleVersion raw -o - "$python_plist")" = \
            "$PYTHON_VERSION"

          tkinter_path="$(find "$app_path/Contents/Frameworks" \
            -type f -name '_tkinter*.so' -print -quit)"
          test -n "$tkinter_path"
          file "$tkinter_path"
          lipo "$tkinter_path" -verify_arch "${{ matrix.target_arch }}"
          tkinter_links="$(otool -L "$tkinter_path")"
          printf '%s\n' "$tkinter_links"
          grep -Eq '@rpath/libtcl9\.0\.dylib .*current version 9\.0\.' \
            <<< "$tkinter_links"
          grep -Eq '@rpath/libtcl9tk9\.0\.dylib .*current version 9\.0\.' \
            <<< "$tkinter_links"

          for tk_library in libtcl9.0.dylib libtcl9tk9.0.dylib; do
            tk_library_path="$app_path/Contents/Frameworks/$tk_library"
            test -f "$tk_library_path"
            file "$tk_library_path"
            lipo "$tk_library_path" -verify_arch "${{ matrix.target_arch }}"
          done

          plist="$app_path/Contents/Info.plist"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$plist")" = "$APP_VERSION"
          test "$(plutil -extract CFBundleVersion raw -o - "$plist")" = "$APP_VERSION"
          codesign --verify --deep --strict --verbose=2 "$app_path"

      - name: Upload full build artifact
        uses: actions/upload-artifact@v4
        with:
          # Artifact names must not include the filename extension: the
          # downloaded file itself retains the exact release name.
          name: ${{ matrix.artifact_name }}-artifact
          path: dist/${{ matrix.artifact_name }}
          if-no-files-found: error

      - name: Upload portable build artifact
        if: runner.os == 'Windows' || runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.portable_artifact_name }}-artifact
          path: dist/${{ matrix.portable_artifact_name }}
          if-no-files-found: error

      - name: Upload full release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact_name }}

      - name: Upload portable release asset
        if: startsWith(github.ref, 'refs/tags/') && (runner.os == 'Windows' || runner.os == 'Linux')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.portable_artifact_name }}
