name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact_name: SileroTTS_Studio_Windows.exe
            
          - name: Linux-x86_64
            os: ubuntu-latest
            artifact_name: SileroTTS_Studio_Linux_x86_64
            
          - name: Linux-ARM64
            os: ubuntu-24.04-arm
            artifact_name: SileroTTS_Studio_Linux_arm64

          - name: macOS-AppleSilicon-ARM64
            os: macos-latest
            artifact_name: SileroTTS_Studio_macOS_AppleSilicon_ARM64.zip
            
          - name: macOS-Intel-x86_64
            os: macos-13
            artifact_name: SileroTTS_Studio_macOS_Intel_x86_64.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install --upgrade setuptools wheel
          pip install -r requirements.txt

      - name: Build Windows (.exe)
        if: runner.os == 'Windows'
        run: pyinstaller --noconsole --onefile --name "SileroTTS_Studio_Windows" SileroTTS_Studio.py

      - name: Build Linux (Binary)
        if: runner.os == 'Linux'
        run: pyinstaller --noconsole --onefile --name "${{ matrix.artifact_name }}" SileroTTS_Studio.py

      - name: Build macOS (.app)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --windowed --name "SileroTTS_Studio_macOS" SileroTTS_Studio.py
          plutil -replace NSHighResolutionCapable -bool true dist/SileroTTS_Studio_macOS.app/Contents/Info.plist || plutil -insert NSHighResolutionCapable -bool true dist/SileroTTS_Studio_macOS.app/Contents/Info.plist

      - name: Package macOS App into ZIP
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r -y ${{ matrix.artifact_name }} SileroTTS_Studio_macOS.app

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.artifact_name }}
