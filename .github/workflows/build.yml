name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install --upgrade setuptools wheel
          pip install -r requirements.txt

      - name: Build Windows (.exe)
        if: runner.os == 'Windows'
        run: pyinstaller --noconsole --onefile --name "SileroTTS_Studio_Windows" SileroTTS_Studio.py

      - name: Build Linux (Binary)
        if: runner.os == 'Linux'
        run: pyinstaller --noconsole --onefile --name "SileroTTS_Studio_Linux" SileroTTS_Studio.py

      - name: Build macOS (.app)
        if: runner.os == 'macOS'
        run: pyinstaller --windowed --target-architecture=universal2 --name "SileroTTS_Studio_macOS" SileroTTS_Studio.py

      - name: Package macOS App into ZIP
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r -y SileroTTS_Studio_macOS.zip SileroTTS_Studio_macOS.app


      - name: Upload Windows Asset
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SileroTTS_Studio_Windows.exe

      - name: Upload Linux Asset
        if: runner.os == 'Linux'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SileroTTS_Studio_Linux

      - name: Upload macOS Asset
        if: runner.os == 'macOS'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SileroTTS_Studio_macOS.zip
